parameters:
  - name: id
    description: Unique student Identifer. The WordPress User `ID`.
    example: 123
    in: path
    required: true
    schema:
      $ref: '#/components/schemas/ResourceId'

get:
  summary: List student grades
  description: |
    Retrieves a student's grades for each course they are enrolled in, including the overall course grade and a per-lesson breakdown with lesson and quiz grades.

    When the LifterLMS Assignments add-on is active, each lesson additionally includes an `assignment` grade block.
  tags:
    - Student Grades
  parameters:
    - $ref: '#/components/parameters/Page'
    - $ref: '#/components/parameters/PerPage'
    - $ref: '#/components/parameters/Order'
    - name: orderby
      description: Specify the sort field for a collection of results. Applies to the student's course enrollments.
      in: query
      schema:
        type: string
        enum:
          - date
          - title
        default: date
    - name: course
      in: query
      description: Limit results to a specific course or a list of courses. Accepts a single course `id` or a comma separated list of course `id`s.
      schema:
        type: string
        example: [1,2,3]
  responses:
    200:
      description: Successfully returned the student's grades.
      headers:
        Link:
          description: Pagination links for the collection.
          schema:
            type: string
            example: >-
              </wp-json/llms/v1/students/123/grades?page=1>; rel="first",
              </wp-json/llms/v1/students/123/grades?page=2>; rel="prev",
              </wp-json/llms/v1/students/123/grades?page=4>; rel="next",
              </wp-json/llms/v1/students/123/grades?page=5>; rel="last"
        X-WP-Total:
          $ref: '#/components/headers/PaginationTotalResults'
        X-WP-TotalPages:
          $ref: '#/components/headers/PaginationTotalPages'
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/StudentGrades'
    400:
      $ref: '#/components/responses/Error400'
    401:
      $ref: '#/components/responses/Error401'
    403:
      $ref: '#/components/responses/Error403'
    404:
      $ref: '#/components/responses/Error404'
