get:
  summary: List certificate templates
  description: Retrieve a list of certificate templates.
  tags:
    - Certificates
  parameters:
    - $ref: '#/components/parameters/Context'
    - $ref: '#/components/parameters/Page'
    - $ref: '#/components/parameters/PerPage'
    - $ref: '#/components/parameters/Order'
    - $ref: '#/components/parameters/Search'
    - name: orderby
      description: Specify the sort field for a collection of results.
      in: query
      schema:
        type: string
        enum:
          - id
          - title
          - date_created
          - date_updated
          - relevance
        default: id
    - $ref: '#/components/parameters/Include'
    - $ref: '#/components/parameters/Exclude'
    - name: status
      description: Filter certificate templates by the post status.
      in: query
      schema:
        type: string
        enum:
          - publish
          - draft
  responses:
    200:
      description: Successfully returned a list of certificate templates.
      headers:
        Link:
          description: Pagination links for the collection.
          schema:
            type: string
            example: >-
              </wp-json/llms/v1/certificates?page=1>; rel="first",
              </wp-json/llms/v1/certificates?page=2>; rel="prev",
              </wp-json/llms/v1/certificates?page=4>; rel="next",
              </wp-json/llms/v1/certificates?page=5>; rel="last"
        X-WP-Total:
          $ref: '#/components/headers/PaginationTotalResults'
        X-WP-TotalPages:
          $ref: '#/components/headers/PaginationTotalPages'
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CertificateResponse'
    400:
      $ref: '#/components/responses/Error400'
    401:
      $ref: '#/components/responses/Error401'
    403:
      $ref: '#/components/responses/Error403'

post:
  summary: Create a certificate template
  description: Create a new certificate template.
  tags:
    - Certificates
  requestBody:
    required: true
    content:
      application/json:
        schema:
          allOf:
            - $ref: '#/components/schemas/CertificateRequest'
            - required:
              - title
              - content
  responses:
    201:
      description: Successfully created the certificate template.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CertificateResponse'
    400:
      $ref: '#/components/responses/Error400'
    401:
      $ref: '#/components/responses/Error401'
    403:
      $ref: '#/components/responses/Error403'
