get:
  summary: List events
  description: |
    Retrieve a list of scheduled events.

    _Available when the [LifterLMS Events](https://lifterlms.com/product/events/) add-on is active._
  tags:
    - Events
  parameters:
    - $ref: '#/components/parameters/Context'
    - $ref: '#/components/parameters/Page'
    - $ref: '#/components/parameters/PerPage'
    - $ref: '#/components/parameters/Order'
    - $ref: '#/components/parameters/Search'
    - name: orderby
      description: Specify the sort field for a collection of results.
      in: query
      schema:
        type: string
        enum:
          - id
          - title
          - date_created
          - date_updated
          - relevance
        default: id
    - $ref: '#/components/parameters/Include'
    - $ref: '#/components/parameters/Exclude'
    - name: product
      description: Limit results to events associated with a specific product (course, membership, or lesson).
      in: query
      schema:
        type: integer
        minimum: 1
        example: 1234
    - name: from
      description: 'Limit results to events starting on or after the given UTC datetime. Format: `Y-m-d` or `Y-m-d H:i:s`.'
      in: query
      schema:
        type: string
        example: '2019-06-01'
    - name: to
      description: 'Limit results to events starting on or before the given UTC datetime. Format: `Y-m-d` or `Y-m-d H:i:s`.'
      in: query
      schema:
        type: string
        example: '2019-06-30'
    - name: status
      description: Filter events by the post status.
      in: query
      schema:
        type: string
        enum:
          - publish
          - draft

  responses:
    200:
      description: Successfully returned a list of events.
      headers:
        Link:
          description: Pagination links for the collection.
          schema:
            type: string
            example: >-
              </wp-json/llms/v1/events?page=1>; rel="first",
              </wp-json/llms/v1/events?page=2>; rel="prev",
              </wp-json/llms/v1/events?page=4>; rel="next",
              </wp-json/llms/v1/events?page=5>; rel="last"
        X-WP-Total:
          $ref: '#/components/headers/PaginationTotalResults'
        X-WP-TotalPages:
          $ref: '#/components/headers/PaginationTotalPages'
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/EventResponse'
    400:
      $ref: '#/components/responses/Error400'
    401:
      $ref: '#/components/responses/Error401'
    403:
      $ref: '#/components/responses/Error403'

post:
  summary: Create an event
  description: |
    Create a new scheduled event.

    _Available when the [LifterLMS Events](https://lifterlms.com/product/events/) add-on is active._
  tags:
    - Events
  requestBody:
    required: true
    content:
      application/json:
        schema:
          allOf:
            - $ref: '#/components/schemas/EventRequest'
            - required:
              - title
              - start_date
  responses:
    201:
      description: Successfully created the event.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EventResponse'
    400:
      $ref: '#/components/responses/Error400'
    401:
      $ref: '#/components/responses/Error401'
    403:
      $ref: '#/components/responses/Error403'
