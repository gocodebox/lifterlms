get:
  summary: List assignments
  description: |
    Retrieve a list of assignments.

    _Available when the [LifterLMS Assignments](https://lifterlms.com/product/lifterlms-assignments/) add-on is active._
  tags:
    - Assignments
  parameters:
    - $ref: '#/components/parameters/Context'
    - $ref: '#/components/parameters/Page'
    - $ref: '#/components/parameters/PerPage'
    - $ref: '#/components/parameters/Order'
    - $ref: '#/components/parameters/Search'
    - name: orderby
      description: Specify the sort field for a collection of results.
      in: query
      schema:
        type: string
        enum:
          - id
          - title
          - date_created
          - date_updated
          - relevance
        default: id
    - $ref: '#/components/parameters/Include'
    - $ref: '#/components/parameters/Exclude'
    - name: lesson
      description: Filter assignments by the parent lesson ID.
      in: query
      schema:
        type: integer
        minimum: 1
        example: 789
    - name: type
      description: Filter assignments by type.
      in: query
      schema:
        type: string
        enum:
          - tasklist
          - essay
          - upload
    - name: status
      description: Filter assignments by the post status.
      in: query
      schema:
        type: string
        enum:
          - publish
          - draft

  responses:
    200:
      description: Successfully returned a list of assignments.
      headers:
        Link:
          description: Pagination links for the collection.
          schema:
            type: string
            example: >-
              </wp-json/llms/v1/assignments?page=1>; rel="first",
              </wp-json/llms/v1/assignments?page=2>; rel="prev",
              </wp-json/llms/v1/assignments?page=4>; rel="next",
              </wp-json/llms/v1/assignments?page=5>; rel="last"
        X-WP-Total:
          $ref: '#/components/headers/PaginationTotalResults'
        X-WP-TotalPages:
          $ref: '#/components/headers/PaginationTotalPages'
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AssignmentResponse'
    400:
      $ref: '#/components/responses/Error400'
    401:
      $ref: '#/components/responses/Error401'
    403:
      $ref: '#/components/responses/Error403'

post:
  summary: Create an assignment
  description: |
    Create a new assignment object.

    _Available when the [LifterLMS Assignments](https://lifterlms.com/product/lifterlms-assignments/) add-on is active._
  tags:
    - Assignments
  requestBody:
    required: true
    content:
      application/json:
        schema:
          allOf:
            - $ref: '#/components/schemas/AssignmentRequest'
            - required:
              - title
  responses:
    201:
      description: Successfully created the assignment.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AssignmentResponse'
    400:
      $ref: '#/components/responses/Error400'
    401:
      $ref: '#/components/responses/Error401'
    403:
      $ref: '#/components/responses/Error403'
