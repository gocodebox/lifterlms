description: Base quiz question post object.
type: object
properties:
  id:
    description: Unique question identifer. The WordPress Post `ID`.
    type: integer
    example: 234
    readOnly: true
  date_created:
    description: 'Creation date. Format: `Y-m-d H:i:s`.'
    type: string
    example: '2019-05-20 17:22:05'
  date_created_gmt:
    description: 'Creation date (in GMT). Format: `Y-m-d H:i:s`.'
    type: string
    example: '2019-05-20 13:22:05'
  date_updated:
    description: 'Date last modified. Format: `Y-m-d H:i:s`.'
    type: string
    example: '2019-05-20 17:25:05'
    readOnly: true
  date_updated_gmt:
    description: 'Date last modified (in GMT). Format: `Y-m-d H:i:s`.'
    type: string
    example: '2019-05-20 13:25:05'
    readOnly: true
  post_type:
    allOf:
      - $ref: '#/components/schemas/PostType'
    type: string
    default: llms_question
  parent_id:
    description: WordPress post ID of the question's parent quiz. `0` indicates an "orphaned" question.
    type: integer
    minimum: 0
    example: 234
  question_type:
    description: The type of the question. Additional types may be registered by add-ons such as LifterLMS Advanced Quizzes.
    type: string
    default: choice
    example: choice
    enum:
      - content
      - choice
      - picture_choice
      - true_false
      - blank
      - reorder
      - picture_reorder
      - short_answer
      - long_answer
      - upload
      - code
      - scale
  points:
    description: The number of points awarded for a correct answer to the question.
    type: integer
    minimum: 0
    default: 1
    example: 10
  multi_choices:
    description: Whether students may select more than one choice. Only used by choice-type questions.
    type: boolean
    default: false
  clarifications:
    description: Clarification text (HTML) displayed to students when reviewing the question after grading.
    type: string
    example: The correct answer is <strong>B</strong> because...
  video_src:
    description: URL to an oEmbed enabled video to display with the question.
    type: string
    example: https://www.youtube.com/watch?v=videoid
  auto_grade:
    description: Whether the question is automatically graded. Used by blank and scale question types. Requires LifterLMS Advanced Quizzes.
    type: boolean
    default: false
  correct_value:
    description: The correct answer used when auto-grading. For blank questions, separate multiple blanks with a pipe (|). Providing a non-empty value enables auto_grade when that field is omitted. Requires LifterLMS Advanced Quizzes.
    type: string
    example: MVP
  case_sensitive:
    description: Whether blank-question answers are treated as case-sensitive during auto-grading. Requires LifterLMS Advanced Quizzes.
    type: boolean
    default: false
  word_count_min:
    description: Whether a minimum word count is enforced for long-answer questions. Requires LifterLMS Advanced Quizzes.
    type: boolean
    default: false
  word_count_max:
    description: Whether a maximum word count is enforced for long-answer questions. Requires LifterLMS Advanced Quizzes.
    type: boolean
    default: false
  words_min:
    description: Minimum word count for long-answer questions when word_count_min is enabled. Requires LifterLMS Advanced Quizzes.
    type: integer
  words_max:
    description: Maximum word count for long-answer questions when word_count_max is enabled. Requires LifterLMS Advanced Quizzes.
    type: integer
  upload_restrict_filetypes:
    description: Whether uploaded files are restricted to the listed mime types. Requires LifterLMS Advanced Quizzes.
    type: boolean
    default: false
  upload_filetypes:
    description: Allowed upload mime-type keys (as returned by get_allowed_mime_types(), e.g. "pdf", "jpg|jpeg|jpe"). Providing a non-empty list enables upload_restrict_filetypes when that field is omitted. Requires LifterLMS Advanced Quizzes.
    type: array
    items:
      type: string
    example:
      - pdf
  code_language:
    description: Code editor language for code questions. Requires LifterLMS Advanced Quizzes.
    type: string
  scale_min:
    description: Minimum value for scale questions. Requires LifterLMS Advanced Quizzes.
    type: integer
  scale_min_label:
    description: Label for the minimum scale value. Requires LifterLMS Advanced Quizzes.
    type: string
  scale_max:
    description: Maximum value for scale questions. Requires LifterLMS Advanced Quizzes.
    type: integer
  scale_max_label:
    description: Label for the maximum scale value. Requires LifterLMS Advanced Quizzes.
    type: string
  choices:
    description: 'List of the question''s choices. Only used by question types which support choices. Treated as the complete set on update: existing choices omitted from the list are deleted.'
    type: array
    items:
      type: object
      properties:
        id:
          description: The choice unique identifier. Provide to update an existing choice, omit to create a new choice.
          type: string
          example: ABC123
        choice:
          description: The choice content. A string for text choices or an object (`id`, `src`) for image choices.
          type: string
          example: Answer text.
        choice_type:
          description: The type of the choice content.
          type: string
          enum:
            - text
            - image
          default: text
        correct:
          description: Whether the choice is a correct answer.
          type: boolean
          default: false
        marker:
          description: The choice marker (A, B, C...). Automatically generated when omitted.
          type: string
          example: A
