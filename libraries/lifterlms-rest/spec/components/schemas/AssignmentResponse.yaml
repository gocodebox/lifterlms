allOf:
  - $ref: '#/components/schemas/Assignment'
  - type: object
    properties:
      title:
        description: Assignment title.
        type: object
        properties:
          rendered:
            type: string
            description: Rendered title.
            example: Essay on the Renaissance
          raw:
            type: string
            description: Raw title. Useful when displaying title in the WP Editor. Only returned in `edit` context.
            example: Essay on the Renaissance
      content:
        description: Assignment description / content.
        type: object
        properties:
          rendered:
            type: string
            description: Rendered content.
            example: <p>Write a 500 word essay on the Renaissance.</p>
          raw:
            type: string
            description: Raw content. Useful when displaying content in the WP Block Editor. Only returned in `edit` context.
            example: <p>Write a 500 word essay on the Renaissance.</p>
      _links:
        description: A map of links to other related API resources.
        type: object
        readOnly: true
        properties:
          self:
            description: REST URI to the assignment.
            type: array
            items:
              type: object
              properties:
                href:
                  type: string
                  example: /wp-json/llms/v1/assignments/876
          collection:
            description: REST URI to the assignments collection.
            type: array
            items:
              type: object
              properties:
                href:
                  type: string
                  example: /wp-json/llms/v1/assignments
          lesson:
            description: REST URI to the assignment's parent lesson.
            type: array
            items:
              type: object
              properties:
                href:
                  type: string
                  example: /wp-json/llms/v1/lessons/789
          submissions:
            description: REST URI to the assignment's submissions collection.
            type: array
            items:
              type: object
              properties:
                href:
                  type: string
                  example: /wp-json/llms/v1/assignment-submissions?assignment=876
