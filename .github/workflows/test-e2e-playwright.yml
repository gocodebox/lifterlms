###
#
# E2E Tests using Playwright.
#
# This workflow can be copied to other repositories via the common gocodebox/.github repo.
#
# Requires:
#   - .wp-env.json in the repo root
#   - playwright.config.js in the repo root
#
###
name: Test E2E (Playwright)

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ 'pull_request' == github.event_name && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
          tools: wp

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start wp-env
        run: npx wp-env start

      - name: Bootstrap E2E test data
        run: bash tests/e2e/bin/setup-env.sh

      - name: Run Playwright tests
        run: npx wp-scripts test-playwright

      - name: Upload artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            artifacts/
          retention-days: 7
