name: Contributors

on:
  workflow_dispatch:
  push:
    branches:
      - trunk

concurrency:
  group: ${{ github.workflow }}-${{ 'pull_request' == github.event_name && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:

  build:
    name: Update contributors
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.ORG_WORKFLOWS }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm install contributor-faces

      - name: Update README.md
        run: ./node_modules/.bin/contributor-faces -e '*\[bot\]' -l 100

      - name: Commit Updates
        run: |
          if git diff --quiet -- README.md; then
            echo "No contributor changes to commit."
            exit 0
          fi
          git config user.name "contributors-workflow[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update contributors list"
          git checkout -- . 2>/dev/null || true
          for i in 1 2 3; do
            git fetch origin trunk
            git rebase origin/trunk && git push origin HEAD:trunk && exit 0
            echo "Push failed (attempt $i), retrying after rebase..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::Failed to push contributor update after 3 attempts."
          exit 1
