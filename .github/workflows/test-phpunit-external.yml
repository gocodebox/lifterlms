name: Test PHPUnit External

# Tests in the `external` group download plugins from WordPress.org, so they can break when a
# third-party release changes. They are excluded from the default suite and run weekly instead.

on:
  workflow_dispatch:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'
  pull_request:
    paths:
      - '.github/workflows/test-phpunit-external.yml'
      - 'tests/phpunit/unit-tests/admin/class-llms-test-sendwp.php'

jobs:
  test:
    name: External tests on PHP 8.4
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: gocodebox/.github/.github/actions/setup-phpunit@trunk
        with:
          php-version: '8.4'
          wp-version: latest
          deploy-key: ${{ secrets.LLMS_DEPLOY_KEY }}
          secrets: ${{ toJSON( secrets ) }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      - name: Install NPM Dependencies
        run: npm ci && npm run build

      - name: Run Tests
        run: vendor/bin/phpunit --group external
